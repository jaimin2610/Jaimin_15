<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Search</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .search-container {
            width: 550px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        /* Search box */
        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 15px 50px 15px 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .search-input:focus {
            border-color: #0066ff;
        }

        .search-icon {
            position: absolute;
            right: 18px;
            top: 15px;
            font-size: 20px;
        }

        /* Suggestions */
        .suggestions {
            position: absolute;
            width: 100%;
            background: white;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 10px 10px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 100;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .suggestion-item {
            padding: 13px 18px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .suggestion-item:hover,
        .suggestion-item.active {
            background: #eef5ff;
            color: #0066ff;
        }

        .car-icon {
            font-size: 20px;
        }

        .car-info {
            display: flex;
            flex-direction: column;
        }

        .car-name {
            font-weight: bold;
            color: #222;
        }

        .car-brand {
            font-size: 13px;
            color: #888;
            margin-top: 3px;
        }

        /* Search button */
        .search-button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0066ff, #00aaff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-button:hover {
            opacity: 0.9;
        }

        /* Result */
        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f2f7ff;
            border-radius: 10px;
            display: none;
        }

        .result h2 {
            color: #0066ff;
            margin-bottom: 10px;
        }

        .result p {
            color: #444;
            margin: 5px 0;
        }

        /* No result */
        .no-result {
            padding: 15px;
            color: #777;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="search-container">

    <h1>🚗 Car Search</h1>

    <p class="subtitle">
        Search for your car by name
    </p>

    <!-- Search -->
    <div class="search-box">

        <input
            type="text"
            id="carSearch"
            class="search-input"
            placeholder="Type car name..."
            autocomplete="off"
        >

        <span class="search-icon">🔍</span>

        <!-- Suggestions -->
        <div id="suggestions" class="suggestions"></div>

    </div>

    <button class="search-button" onclick="searchCar()">
        Search Car
    </button>


    <!-- Result -->
    <div class="result" id="result">

        <h2 id="resultName"></h2>

        <p>
            <strong>Brand:</strong>
            <span id="resultBrand"></span>
        </p>

        <p>
            <strong>Price:</strong>
            <span id="resultPrice"></span>
        </p>

        <p>
            <strong>Year:</strong>
            <span id="resultYear"></span>
        </p>

    </div>

</div>


<script>

    /*
    ========================================
        CAR DATABASE
    ========================================
    */

    const cars = [

        {
            name: "Honda City",
            brand: "Honda",
            price: "₹12.50 Lakh",
            year: 2024
        },

        {
            name: "Honda Amaze",
            brand: "Honda",
            price: "₹9.50 Lakh",
            year: 2024
        },

        {
            name: "Honda Elevate",
            brand: "Honda",
            price: "₹15.00 Lakh",
            year: 2024
        },

        {
            name: "Toyota Fortuner",
            brand: "Toyota",
            price: "₹35.50 Lakh",
            year: 2023
        },

        {
            name: "Toyota Innova Crysta",
            brand: "Toyota",
            price: "₹25.00 Lakh",
            year: 2024
        },

        {
            name: "Toyota Urban Cruiser",
            brand: "Toyota",
            price: "₹12.00 Lakh",
            year: 2024
        },

        {
            name: "Hyundai Creta",
            brand: "Hyundai",
            price: "₹15.20 Lakh",
            year: 2024
        },

        {
            name: "Hyundai Venue",
            brand: "Hyundai",
            price: "₹11.00 Lakh",
            year: 2024
        },

        {
            name: "Hyundai Verna",
            brand: "Hyundai",
            price: "₹14.00 Lakh",
            year: 2024
        },

        {
            name: "Tata Nexon",
            brand: "Tata",
            price: "₹10.80 Lakh",
            year: 2024
        },

        {
            name: "Tata Punch",
            brand: "Tata",
            price: "₹9.00 Lakh",
            year: 2024
        },

        {
            name: "Tata Harrier",
            brand: "Tata",
            price: "₹20.00 Lakh",
            year: 2024
        },

        {
            name: "Maruti Swift",
            brand: "Maruti Suzuki",
            price: "₹8.50 Lakh",
            year: 2024
        },

        {
            name: "Maruti Baleno",
            brand: "Maruti Suzuki",
            price: "₹9.00 Lakh",
            year: 2024
        },

        {
            name: "Maruti Brezza",
            brand: "Maruti Suzuki",
            price: "₹12.50 Lakh",
            year: 2024
        },

        {
            name: "Mahindra Thar",
            brand: "Mahindra",
            price: "₹15.50 Lakh",
            year: 2024
        },

        {
            name: "Mahindra Scorpio",
            brand: "Mahindra",
            price: "₹18.50 Lakh",
            year: 2024
        },

        {
            name: "Mahindra XUV700",
            brand: "Mahindra",
            price: "₹22.00 Lakh",
            year: 2024
        },

        {
            name: "Kia Seltos",
            brand: "Kia",
            price: "₹16.00 Lakh",
            year: 2024
        },

        {
            name: "Kia Sonet",
            brand: "Kia",
            price: "₹11.50 Lakh",
            year: 2024
        }

    ];


    /*
    ========================================
        VARIABLES
    ========================================
    */

    const searchInput = document.getElementById("carSearch");
    const suggestionsBox = document.getElementById("suggestions");

    let selectedIndex = -1;


    /*
    ========================================
        SHOW SUGGESTIONS
    ========================================
    */

    searchInput.addEventListener("input", function () {

        const query = this.value
            .toLowerCase()
            .trim();

        suggestionsBox.innerHTML = "";

        selectedIndex = -1;


        // If search box is empty
        if (query === "") {

            suggestionsBox.style.display = "none";

            return;
        }


        /*
        Find cars whose name or brand
        matches the typed text
        */

        const filteredCars = cars.filter(car =>

            car.name.toLowerCase().includes(query) ||

            car.brand.toLowerCase().includes(query)

        );


        // No cars found
        if (filteredCars.length === 0) {

            suggestionsBox.innerHTML =
                `<div class="no-result">
                    No cars found
                </div>`;

            suggestionsBox.style.display = "block";

            return;
        }


        /*
        Create suggestions
        */

        filteredCars.forEach((car, index) => {

            const item = document.createElement("div");

            item.classList.add("suggestion-item");

            item.innerHTML = `

                <span class="car-icon">🚗</span>

                <div class="car-info">

                    <span class="car-name">
                        ${car.name}
                    </span>

                    <span class="car-brand">
                        ${car.brand}
                    </span>

                </div>

            `;


            /*
            Click suggestion
            */

            item.addEventListener("click", function () {

                searchInput.value = car.name;

                suggestionsBox.style.display = "none";

                displayCar(car);

            });


            suggestionsBox.appendChild(item);

        });


        suggestionsBox.style.display = "block";

    });


    /*
    ========================================
        KEYBOARD NAVIGATION
    ========================================
    */

    searchInput.addEventListener("keydown", function (event) {

        const items =
            suggestionsBox.querySelectorAll(
                ".suggestion-item"
            );


        if (event.key === "ArrowDown") {

            event.preventDefault();

            if (items.length === 0) return;

            selectedIndex++;

            if (selectedIndex >= items.length) {
                selectedIndex = 0;
            }

            updateActiveSuggestion(items);

        }


        else if (event.key === "ArrowUp") {

            event.preventDefault();

            if (items.length === 0) return;

            selectedIndex--;

            if (selectedIndex < 0) {
                selectedIndex = items.length - 1;
            }

            updateActiveSuggestion(items);

        }


        else if (event.key === "Enter") {

            event.preventDefault();

            if (
                selectedIndex >= 0 &&
                items[selectedIndex]
            ) {

                items[selectedIndex].click();

            }

            else {

                searchCar();

            }

        }


        else if (event.key === "Escape") {

            suggestionsBox.style.display = "none";

        }

    });


    /*
    ========================================
        HIGHLIGHT ACTIVE SUGGESTION
    ========================================
    */

    function updateActiveSuggestion(items) {

        items.forEach(item => {

            item.classList.remove("active");

        });


        if (items[selectedIndex]) {

            items[selectedIndex]
                .classList.add("active");

        }

    }


    /*
    ========================================
        SEARCH CAR
    ========================================
    */

    function searchCar() {

        const query = searchInput.value
            .toLowerCase()
            .trim();


        if (query === "") {

            alert("Please enter a car name.");

            return;

        }


        const car = cars.find(car =>

            car.name.toLowerCase() === query

        );


        if (car) {

            displayCar(car);

        }

        else {

            /*
            Also allow partial search
            */

            const partialCar = cars.find(car =>

                car.name
                    .toLowerCase()
                    .includes(query)

            );


            if (partialCar) {

                searchInput.value =
                    partialCar.name;

                displayCar(partialCar);

            }

            else {

                alert(
                    "Car not found. Please select a car from the suggestions."
                );

            }

        }

    }


    /*
    ========================================
        DISPLAY CAR
    ========================================
    */

    function displayCar(car) {

        document.getElementById("resultName")
            .innerText = car.name;

        document.getElementById("resultBrand")
            .innerText = car.brand;

        document.getElementById("resultPrice")
            .innerText = car.price;

        document.getElementById("resultYear")
            .innerText = car.year;


        document.getElementById("result")
            .style.display = "block";


        suggestionsBox.style.display = "none";

    }


    /*
    ========================================
        CLOSE SUGGESTIONS
        WHEN CLICKING OUTSIDE
    ========================================
    */

    document.addEventListener("click", function (event) {

        if (!event.target.closest(".search-box")) {

            suggestionsBox.style.display = "none";

        }

    });

</script>

</body>
</html>
